[project]
name = "brote-agent"
version = "0.1.0"
description = "AI agent backend for the Brote plant-care mobile app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "pydantic-settings>=2.7.0",
    "structlog>=25.1.0",
    "supabase>=2.7.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001",   # Copyright notice not required
    "COM812",   # Conflicts with the formatter
    "D",        # Docstrings — deferred to a later feature
    "PLR2004",  # Magic values OK in tests
    "UP037",    # Quote removal conflicts with TYPE_CHECKING pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ASYNC", "ANN"]
"app/config/settings.py" = ["D101"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
