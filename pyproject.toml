[project]
name = "brote-agent"
version = "0.1.0"
description = "AI agent backend for the Brote plant-care mobile app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "httpx>=0.27",
    "pillow>=10.4",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.9",
    "structlog>=25.1.0",
    "supabase>=2.7.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001",   # Copyright notice not required
    "COM812",   # Conflicts with the formatter
    "D",        # Docstrings — deferred to a later feature
    "PLR2004",  # Magic values OK in tests
    "UP037",    # Quote removal conflicts with TYPE_CHECKING pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "ASYNC", "ANN", "PLR0913", "PLR0917", "ARG001", "ARG002", "PLC0415", "F841", "E501", "ERA001", "FBT003", "RUF100"]
"app/config/settings.py" = ["D101"]
"app/conversations/audit.py" = ["PLR0913"]
"app/conversations/routes.py" = ["FAST002", "B008"]
"app/conversations/models.py" = ["TC003"]
"app/conversations/history.py" = ["TC001"]
"app/dynamic_states/statuses.py" = ["S311"]
"app/api/sse_routes.py" = ["FAST002", "B008", "C901", "PLR0915", "ANN201", "ANN202", "ARG001", "FBT001", "ANN001"]
"app/vision/routes.py" = ["FAST002", "B008", "C901", "PLR0915", "ANN201", "ARG001", "FBT001", "BLE001", "PLR0917", "PLR0913", "PLR0911"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
